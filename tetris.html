<!DOCTYPE html>
<html>
<head>
<style>
body { background-color: #0e1117; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
#game-container { display: flex; justify-content: center; align-items: flex-start; gap: 15px; margin-top: 10px; }
canvas { border: 2px solid #333; background-color: #111; box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5); }
.side-panel { display: flex; flex-direction: column; align-items: center; text-align: left; }
.preview-box { border: 2px solid #333; background-color: #111; margin-bottom: 10px; width: 100px; height: 100px; }
#stats { font-size: 16px; margin-top: 10px; font-weight: bold; color: #ccc; }
.btn { background-color: #ff4b4b; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; border-radius: 5px; font-weight: bold; }
.btn:hover { background-color: #ff2222; }
.label { font-size: 13px; margin-bottom: 4px; color: #888; font-weight: bold; }
</style>
</head>
<body tabindex="0">
<div id="game-container">
    <div class="side-panel">
        <div class="label">DEPO (HOLD)</div>
        <canvas id="hold" class="preview-box" width="100" height="100"></canvas>
    </div>
    <div><canvas id="tetris" width="200" height="400"></canvas></div>
    <div class="side-panel">
        <div class="label">SONRAKİ</div>
        <canvas id="next" class="preview-box" width="100" height="100"></canvas>
        <div id="stats">Satır: <span id="lines">0</span>/10<br>Süre: <span id="time">0.0</span>s</div>
    </div>
</div>
<button class="btn" onclick="resetGame()">Oyunu Başlat / Yeniden Başlat</button>
<div style="font-size: 12px; color: #aaa; margin-top: 8px;">Kontroller: A/D (DAS) | W (Soft Drop) | S (Zank Yapıştır) | Shift (Depo) | Ok Tuşları (Döndür)</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
context.scale(20, 20);

const nextCanvas = document.getElementById('next');
const nextContext = nextCanvas.getContext('2d');
nextContext.scale(20, 20);

const holdCanvas = document.getElementById('hold');
const holdContext = holdCanvas.getContext('2d');
holdContext.scale(20, 20);

function createMatrix(w, h) {
    const matrix = []; while (h--) { matrix.push(new Array(w).fill(0)); } return matrix;
}

function createPiece(type) {
    if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
    if (type === 'O') return [[2, 2], [2, 2]];
    if (type === 'L') return [[0, 0, 3], [3, 3, 3], [0, 0, 0]];
    if (type === 'J') return [[4, 0, 0], [4, 4, 4], [0, 0, 0]];
    if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
    if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
    if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
}

function getRandomPieceType() {
    const pieces = 'TJLOSZI';
    return pieces[Math.floor(Math.random() * pieces.length)];
}

const colors = [null, '#FF0d72', '#0dc2ff', '#0dff72', '#f538ff', '#ff8e0d', '#ffe138', '#3877ff'];
const arena = createMatrix(10, 20);

const player = {
    pos: {x: 0, y: 0},
    matrix: null,
    type: null,
    next: null,
    hold: null,
    holdType: null,
    holdUsed: false
};

let dropCounter = 0, dropInterval = 500, lastTime = 0, startTime = 0, gameOver = false, linesCleared = 0, animationId;
let keys = {};
let moveTimer = 0;
let softDropTimer = 0;
let dasInitialDelay = 110;
let dasRepeatRate = 20;
let activeDir = 0;
let dasTimer = 0;

function playerReset() {
    if (!player.next) {
        player.next = getRandomPieceType();
    }
    player.type = player.next;
    player.matrix = createPiece(player.type);
    player.next = getRandomPieceType();
    
    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
    player.holdUsed = false;
    
    if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        gameOver = true;
    }
}

function playerHold() {
    if (player.holdUsed) return;
    
    if (player.holdType === null) {
        player.holdType = player.type;
        player.hold = createPiece(player.holdType);
        playerReset();
    } else {
        let tempType = player.type;
        player.type = player.holdType;
        player.matrix = createPiece(player.type);
        player.holdType = tempType;
        player.hold = createPiece(player.holdType);
        
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
    }
    player.holdUsed = true;
}

function collide(arena, player) {
    const m = player.matrix; const o = player.pos;
    if (!m) return false;
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
        }
    }
    return false;
}

function merge(arena, player) {
    if (!player.matrix) return;
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => { if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value; });
    });
}

function arenaSweep() {
    outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) { if (arena[y][x] === 0) continue outer; }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        linesCleared++;
        document.getElementById('lines').innerText = linesCleared;
        if (linesCleared >= 10 && !gameOver) {
            gameOver = true;
            cancelAnimationFrame(animationId);
            alert('Tebrikler! 10 satırı tamamladın. Süre: ' + ((Date.now() - startTime)/1000).toFixed(1) + ' saniye.');
        }
    }
}

function playerDrop() {
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
    }
    dropCounter = 0;
}

function playerHardDrop() {
    while (!collide(arena, player)) { player.pos.y++; }
    player.pos.y--;
    merge(arena, player);
    playerReset();
    arenaSweep();
    dropCounter = 0;
}

function playerMove(dir) {
    player.pos.x += dir; if (collide(arena, player)) player.pos.x -= dir;
}

function playerRotate(dir) {
    if (!player.matrix) return;
    const posX = player.pos.x; let offset = 1;
    rotate(player.matrix, dir);
    while (collide(arena, player)) {
        player.pos.x += offset; offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) { rotate(player.matrix, -dir); player.pos.x = posX; return; }
    }
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) { let t = matrix[y][x]; matrix[y][x] = matrix[x][y]; matrix[x][y] = t; }
    }
    if (dir > 0) matrix.forEach(row => row.reverse()); else matrix.reverse();
}

function drawMatrix(ctx, matrix, offset, alpha = 1.0) {
    if (!matrix) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    matrix.forEach((row, y) => {
        row.forEach((value, x) => { if (value !== 0) { ctx.fillStyle = colors[value]; ctx.fillRect(x + offset.x, y + offset.y, 1, 1); } });
    });
    ctx.restore();
}

function getGhostY() {
    if (!player.matrix) return player.pos.y;
    let ghostY = player.pos.y;
    while (!collide(arena, {matrix: player.matrix, pos: {x: player.pos.x, y: ghostY + 1}})) {
        ghostY++;
    }
    return ghostY;
}
